# Dense control. Small, stock transformers loader; a failure here is more likely a harness bug than a model bug.
name: qwen3-0.6b
checkpoint: Qwen/Qwen3-0.6B

launch:
  dtype: bfloat16
  max_seq_len: 32768
  trainer:
    loader: huggingface
    attn_implementation: flash_attention_3
    parallelism: {expert_parallel: 1, sequence_parallel: 1}
  engine: {gradient_clipping: 0.0, fp32_masters: false}
  sampler:
    tensor_parallel_size: 1
    max_model_len: 32768
    enable_prefix_caching: true
  optimizer: {lr: 1.0e-6, betas: [0.9, 0.999], eps: 1.0e-8, weight_decay: 0.0}

probe:
  pass_labels: false

tiny:
  text_overrides:
    hidden_size: 256
    intermediate_size: 512
    num_attention_heads: 4
    num_key_value_heads: 2
  max_row_len: 2048
  parallel:
    - {expert_parallel: 1, sequence_parallel: 2}
    - {expert_parallel: 1, sequence_parallel: 1, world_size: 2}
  sampler:
    max_model_len: 4096
    gpu_memory_utilization: 0.3

expect:
  loader: huggingface
  no_grad_params: []

known_issues:
  optimizer.update_lands_at_launch_lr:
    issue: pending
    summary: "engine default bf16 master weights drop ~98% of a 1e-6 AdamW step; fp32_masters: true keeps it"
  parallel.logprobs_match_baseline[ep1-sp2]:
    issue: pending
    summary: "huggingface loader accepts SP > 1 but installs no sequence-parallel attention for attention-only models"
  parallel.gradients_match_reference[ep1-sp2]:
    issue: pending
    summary: "same cause as parallel.logprobs_match_baseline[ep1-sp2]"

not_applicable: {}
