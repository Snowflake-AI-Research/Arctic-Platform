[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# this is needed when we want to point to a github branch in `dependencies` - leave it enabled
allow-direct-references = true
license-files = [
  "LICENSE",
]

[tool.hatch.build]
include = [
  "arctic_platform",
  "arctic_platform/integrations/verl/config/**/*.yaml",
  "arctic_platform/integrations/verl/examples/*.sh",
  "arctic_platform/integrations/verl/README.md",
]
# Kept beside the inference package and left out of the wheel. Trailing
# slashes make hatchling skip the directories. csrc/, setup.py, and
# semi_persistence/scripts stay in the wheel.
exclude = [
  "arctic_platform/inference/benchmark/",
  "arctic_platform/inference/docs/",
  "arctic_platform/inference/projects/",
  "arctic_platform/inference/README.md",
]

# Compile csrc only when ARCTIC_INFERENCE_PRECOMPILED_OPS is set. Hatchling
# does not run setup.py otherwise, so a cortex or inference install stays
# source-only unless that variable is set. Torch has to already be installed;
# use --no-build-isolation so the build can import it.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.force-include]
"hatch_build.py" = "hatch_build.py"

[project.urls]
Homepage = "https://github.com/Snowflake-AI-Research/Arctic-Platform"
Repository = "https://github.com/Snowflake-AI-Research/Arctic-Platform"
Issues = "https://github.com/Snowflake-AI-Research/Arctic-Platform/issues"

[project]
name = "arctic_platform"
version = "0.1.5rc9"
