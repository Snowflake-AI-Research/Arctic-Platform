[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# this is needed when we want to point to a github branch in `dependencies` - leave it enabled
allow-direct-references = true
license-files = [
  "LICENSE",
]

[tool.hatch.build]
include = [
  "arctic_platform",
  "arctic_platform/integrations/verl/config/**/*.yaml",
  "arctic_platform/integrations/verl/examples/*.sh",
  "arctic_platform/integrations/verl/README.md",
  "arctic_platform/integrations/harbor/README.md",
]

[project.urls]
Homepage = "https://github.com/Snowflake-AI-Research/Arctic-Platform"
Repository = "https://github.com/Snowflake-AI-Research/Arctic-Platform"
Issues = "https://github.com/Snowflake-AI-Research/Arctic-Platform/issues"

[project]
name = "arctic_platform"
version = "0.1.3.dev0"
description = "Snowflake LLM training library w/ RL"
authors = [
    {author = "Tunji Ruwase", email = "tunji.ruwase@snowflake.com"},
    {author = "Stas Bekman", email = "stas.bekman@snowflake.com"},
    {author = "Michael Wyatt", email = "michael.wyatt@snowflake.com"},
    {author = "Jeff Rasley", email = "jeff.rasley@snowflake.com"},
    {author = "Samyam Rajbhandari", email = "samyam.rajbhandari@snowflake.com"},
]
license = "Apache-2.0"
readme = "README.md"
keywords = ["llm", "training", "rl"]

classifiers = [
  # How mature is this project?  4 - Beta / 5 - Production/Stable
  "Development Status :: 4 - Beta",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

requires-python = ">=3.10"


# Dependencies for the project
dependencies = [
    "datasets",
    "deepspeed>=0.19.2",  # fix the static buffers in mixed precision
    "devtools",
    "jsonlines",
    "loguru",
    "nvidia-ml-py",
    "openai>=1.48.0",
    "peft",
    "psutil",
    "pydantic>=2.10",
    "tabulate",
    "tenacity",
    "torch",
    "tqdm",
    "transformers>=4.57.0,<5",
#    "transformers>=5.5", # want to switch to v5 but vllm18 blocks us at v4
    "wandb",
    "yq",
]

# Optional development dependencies
[project.optional-dependencies]
all = [
    "arctic_platform[dev]",
    "arctic_platform[testing]",
    "arctic_platform[rl]",
    "arctic_platform[verl]",
]

dev = [
    "arctic_platform[formatting]",
    "arctic_platform[testing]",
]

testing = [
    "parameterized",
    "pytest-instafail",
    "pytest-flakefinder",
    "pytest-sugar",
    "pytest-timeout",
    "pytest-xdist",
    "pytest",
]

formatting = [
    "pre-commit",
    "autoflake",
]


rl = [
    "liger-kernel>=0.8.0",
    "ray",
    "tensordict",
    "uvicorn",
    "vllm==0.18.0",
]

# verl adapter (arctic_platform/integrations/verl). verl itself is user-supplied and
# version-pinned in launchers; here we only carry the small set of shared runtime
# dependencies the adapter itself needs beyond the base install and the [rl] extra.
verl = [
    "arctic_platform[rl]",
    "codetiming",
    "hydra-core>=1.3",
    "omegaconf",
]

# Harbor plugin (arctic_platform/integrations/harbor). Depends on Harbor being
# installed alongside; we don't pull it in transitively — Harbor is the primary
# product and the user chooses its version. See the subpackage README for the
# supported ``harbor run --agent arctic-cortex-agent --env arctic-cortex-env``
# CLI surface.
harbor = [
    "arctic_platform[rl]",
    "harbor",
]

# ---------------------------------------------------------------------------
# Harbor plugin registration.
#
# Harbor discovers plugins via ``importlib.metadata.entry_points(group=
# "harbor.plugins")`` — see ``harbor.cli.plugin_registry``. Installing
# ``arctic_platform`` registers our agent + environment under short names so
# users can pass ``--agent arctic-cortex-agent`` / ``--env arctic-cortex-env``
# instead of full ``module:Class`` import paths.
# ---------------------------------------------------------------------------
[project.entry-points."harbor.plugins"]
arctic-cortex-agent = "arctic_platform.integrations.harbor.agent:CortexRLAgent"
arctic-cortex-env   = "arctic_platform.integrations.harbor.env:HostEnvironment"

# ---------------------------------------------------------------------------
# Console scripts. Harbor doesn't yet have a ``harbor train`` subcommand, so
# training is invoked via ``harbor-cortex-train`` — a thin CLI that drives
# real ``harbor run`` between GRPO steps. If/when Harbor adds a ``train``
# subcommand that discovers backends via entry points, the same
# ``arctic_platform.integrations.harbor.train:cli`` is a drop-in backend.
# ---------------------------------------------------------------------------
[project.scripts]
harbor-cortex-train     = "arctic_platform.integrations.harbor.train:cli"
harbor-cortex-aggregate = "arctic_platform.integrations.harbor.aggregate:main"

[tool.pytest.ini_options]
# Only auto-collect the maintained suite.
testpaths = ["tests"]

# Per-test wall-clock cap
timeout = 300

# Cooperative whole-suite cap (pytest-timeout): checked between tests, so it bounds total wall-clock for a normal
# run. Disable it for intentionally long runs that exceed it, e.g. flakefinder: `pytest --session-timeout=0 ...`.
session_timeout = 3600

timeout_method = "signal"

markers = [
    "vllm: marks a GPU test that drives the vLLM sampling engine; it cannot run concurrently with other GPU tests, so it is pinned to a single xdist worker via xdist_group. Exclude it from a parallel pool with '-m \"not vllm\"' and run it on its own.",
    "gpu_serial: marks a heavyweight GPU test whose body must hold the host-wide GPU lock (serialized across xdist workers by the _serialize_gpu_work autouse fixture).",
]
