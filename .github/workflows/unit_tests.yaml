name: Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        id: setup_python
        with:
          python-version: '3.12'
      - name: Get latest dependency versions
        id: get_latest_versions
        run: |
          torch_version=$(python -m pip index versions torch --index-url https://download.pytorch.org/whl/cpu | perl -ne 'm|Available versions: ([\d\.]+)| && print $1')
          deepspeed_version=$(python -m pip index versions deepspeed | perl -ne 'm|Available versions: ([\d\.]+)| && print $1')
          versions="torch-$torch_version-deepspeed-$deepspeed_version"
          echo "versions=$versions" >> $GITHUB_OUTPUT
      - name: Restore cached virtualenv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          key: venv-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-${{ steps.get_latest_versions.outputs.versions }}-${{ hashFiles('pyproject.toml') }}
          path: .venv
      - name: Restore cached torch extensions
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/torch_extensions
          key: torch-extensions-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-${{ steps.get_latest_versions.outputs.versions }}
      - name: Restore huggingface cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/huggingface
          key: huggingface-cache-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}-${{ steps.get_latest_versions.outputs.versions }}
      - name: Setup environment
        run: |
          pip install uv
          if [ ! -d .venv ]; then
            uv venv
          fi
          source .venv/bin/activate
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install ".[sft,testing]"
      - name: Environment print
        run: |
          uv pip list
      - name: Unit Tests
        run: |
          cd tests
          python -m pytest -s -v --ignore=inference
      # Own pytest process: the streaming stand-ins put a fake vllm in
      # sys.modules, which would leak into the main suite.
      - name: Streaming Tests
        timeout-minutes: 10  # the suite takes ~1 min; guards against a hung Ray actor
        # Ray actor processes import cpu_support too, so conftest.py's sys.path fix isn't enough.
        run: |
          PYTHONPATH=$PWD:$PWD/tests/inference/streaming python -m pytest -v -m "not gpu" \
            -c tests/inference/streaming/pytest.ini tests/inference/streaming
      # These files pass with the CPU torch, ray, and pydantic this job already
      # installs, and without vLLM. The rest of tests/inference stays ignored:
      # some import vLLM, some require CUDA, and several server tests fail
      # while importing ChatModel under the pydantic this job resolves.
      # --noconftest skips tests/conftest.py, which initializes DeepSpeed for
      # the training suite. These tests do not use that process group.
      # Grammar tests are a separate process: test_weight_sync_engine_buffers.py
      # installs a stand-in vllm at import, and the grammar file uses
      # importorskip("vllm") to skip the checks that need the real package.
      - name: Inference CPU tests
        run: |
          python -m pytest -v --noconftest \
            tests/inference/unit_tests/test_spec_decode_grammar.py
          python -m pytest -v --noconftest \
            tests/inference/unit_tests/test_dense_prompt_logprobs.py \
            tests/inference/unit_tests/test_lora_peft_config.py \
            tests/inference/unit_tests/test_model_config.py \
            tests/inference/unit_tests/test_patching.py \
            tests/inference/unit_tests/test_vllm_version.py \
            tests/inference/unit_tests/test_weight_sync_engine_buffers.py
