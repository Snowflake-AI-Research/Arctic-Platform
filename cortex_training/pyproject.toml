[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-training"
version = "0.0.2"
description = "Python SDK and command-line tools for Cortex Training"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
dependencies = [
    "requests>=2.28.0",
    "tenacity>=8.2.0",
    "boto3",
    "typing-extensions>=4.0.0; python_version < '3.10'",
    "torch",
    "safetensors",
    "textual>=0.50"
]

[project.scripts]
cortex-training = "cortex_training.cli:main"
ct = "cortex_training.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cortex_training*"]
exclude = ["tests*"]
