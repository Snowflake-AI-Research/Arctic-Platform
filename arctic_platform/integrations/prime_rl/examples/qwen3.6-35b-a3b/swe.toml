# examples/advanced/qwen3-30b-a3b/swe.toml on Snowflake Cortex at half scale: one 8-GPU
# training sub-job and one 8-GPU sampling sub-job, with the batch and in-flight budget halved.
# Cortex serves Qwen3.6-35B-A3B from its model catalog. The recipe's cp = 2 becomes Cortex's
# Ulysses sequence parallelism (cortex.training.sp_size).
#
#   python -m arctic_platform.integrations.prime_rl.rl \
#     @ arctic_platform/integrations/prime_rl/examples/qwen3.6-35b-a3b/swe.toml
#
# The SWE sandbox uses PrimeIntellect's sandbox service (verifiers' default `prime`
# runtime); set env.agent.runtime.* to pick another verifiers runtime.

seq_len = 131072

[log]
level = "debug"

[model]
name = "Qwen/Qwen3.6-35B-A3B"

[monitors.wandb]
project = "prime_rl_ct"

[trainer.model]
attn = "flash_attention_3"
ep = 8

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-6

[orchestrator]
batch_size = 256
max_off_policy_steps = 16

[orchestrator.train]
group_size = 8

[orchestrator.concurrency]
initial_inflight = 512

[[orchestrator.train.source]]
name = "swe"
env.taskset.id = "r2e-gym"
env.agent.harness.id = "bash"
env.agent.runtime.labels = ["qwen36-cortex-swe", "swe"]

[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "swe-bench-verified"
env.taskset.id = "swebench-verified"
env.agent.harness.id = "bash"
env.agent.runtime.labels = ["qwen36-cortex-swe", "swe-bench-verified"]

[cortex.training]
sp_size = 2

[cortex.sampling.vllm_config]
tensor_parallel_size = 8
