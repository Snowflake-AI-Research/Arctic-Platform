# examples/advanced/qwen3-30b-a3b/math.toml on Snowflake Cortex at half scale: one 8-GPU
# training sub-job and one 8-GPU sampling sub-job, with the batch and in-flight budget halved.
# Cortex serves Qwen3.6-35B-A3B from its model catalog.
#
#   python -m arctic_platform.integrations.prime_rl.rl \
#     @ arctic_platform/integrations/prime_rl/examples/qwen3.6-35b-a3b/math.toml

seq_len = 32768

[log]
level = "debug"

[model]
name = "Qwen/Qwen3.6-35B-A3B"

[monitors.wandb]
project = "prime_rl_ct"

[trainer.model]
attn = "flash_attention_3"
ep = 8

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-6

[orchestrator]
batch_size = 256
max_off_policy_steps = 8

[orchestrator.train]
group_size = 8

[orchestrator.concurrency]
initial_inflight = 512

[orchestrator.train.sampling]
max_completion_tokens = 32768

[[orchestrator.train.source]]
name = "math"
env.taskset.id = "i3_math"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "aime2025"
env.taskset.id = "aime25"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[cortex.sampling.vllm_config]
tensor_parallel_size = 8
