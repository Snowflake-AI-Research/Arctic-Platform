# Qwen3.5-4B math — CLEAN-DATASET variant. Identical to math-stable.toml except the training env:
# swap i3_math -> math_env. Root cause of the math-stable "collapse" was NOT training dynamics
# (approx_kl/mismatch_kl ~3e-4, clip_ratio 0, grad_norm ~0.03 all flat) but a corrupted reward:
# i3_math's dataset (PrimeIntellect/INTELLECT-3-RL math) has ~18% wrong gold labels (measured over
# 458 early groups: 76% of all-wrong groups had >=5/8 rollouts unanimously agree on an answer the
# grader scored 0 -- e.g. gold=40/model=60 8/8, gold=3780/model=7560 8/8). Wrong labels poison GRPO
# advantages (a correct answer gets negative advantage), driving both the measured drop and genuine
# model degradation. The known-good reference recipe (prime_snowrl kubernetes_example/qwen3_4b_math)
# uses math_env instead: PrimeIntellect/Hendrycks-Math (clean, canonical labels) with the same
# math-verify grader. This swap is the faithful fix.
#
# judge="None": math_env defaults an LLM reference-judge fallback that calls Prime inference
# (api.pinference.ai, needs PRIME_API_KEY). The Cortex rollout runtime has no such key, so the judge
# would crash on every math-verify miss. Hendrycks-Math labels are clean enough for bare math-verify;
# enable the judge later only if format-equivalence false-negatives show up AND a reachable judge
# endpoint is wired in.
#
# Everything else (131072 + dense LM-head chunking via jobs.py, CISPO cap 3.0, near-on-policy
# max_off_policy_steps=1) matches math-stable.toml verbatim.

seq_len = 131072
max_steps = 30

[log]
level = "debug"

[model]
name = "Qwen/Qwen3.5-4B"

[monitors.wandb]
project = "prime_rl_ct"

[trainer.model]
attn = "auto"
ep = 1

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-6

[trainer.loss]
type = "cispo"
ratio_low = 0.0
ratio_high = 3.0

[orchestrator]
batch_size = 256
max_off_policy_steps = 1

[orchestrator.train]
group_size = 8

[orchestrator.concurrency]
initial_inflight = 512

[orchestrator.train.sampling]
max_completion_tokens = 131072

[[orchestrator.train.source]]
name = "math"
env.taskset.id = "math_env"
env.taskset.task.judge = "None"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[cortex.training]
model_provider = "default"

[cortex.sampling.vllm_config]
tensor_parallel_size = 1
language_model_only = true
