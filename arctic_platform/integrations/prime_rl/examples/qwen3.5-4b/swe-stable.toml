# Qwen3.5-4B SWE — STABILIZED variant. The faithful IPO-default recipe declined (0.557->0.507->0.426
# over 3 steps). Adds the two Cortex-portable levers from the known-good 4B config: CISPO cap 3.0 and
# near-on-policy max_off_policy_steps=1. Everything else matches examples/qwen3.5-4b/swe.toml
# (131072 + dense LM-head chunking via jobs.py). Sandbox-env/mg-0 come from the overlay.

seq_len = 131072
max_steps = 15

[log]
level = "debug"

[model]
name = "Qwen/Qwen3.5-4B"

[monitors.wandb]
project = "prime_rl_ct"

[trainer.model]
attn = "auto"
ep = 1

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-6

[trainer.loss]
type = "cispo"
ratio_low = 0.0
ratio_high = 3.0

[orchestrator]
batch_size = 256
max_off_policy_steps = 1

[orchestrator.train]
group_size = 8

[orchestrator.concurrency]
initial_inflight = 256

[[orchestrator.train.source]]
name = "swe"
env.taskset.id = "r2e-gym"
env.agent.harness.id = "bash"
env.agent.runtime.labels = ["qwen3.5-4b-cortex-swe", "swe"]

[cortex.training]
model_provider = "default"

[cortex.sampling.vllm_config]
tensor_parallel_size = 1
language_model_only = true
