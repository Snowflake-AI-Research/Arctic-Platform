# Qwen3.5-4B SWE — identical to swe-stable.toml, only max_steps 15 -> 300 (a real long run). The
# stable run already climbed cleanly (all-reward/solve-rate 0.41 -> 0.73 over its 15 steps); this run
# confirms the upward trend sustains over hundreds of steps. SWE reward is execution-based (run the
# tests), so unlike i3_math it has no label-noise problem — see [[project_i3math_label_noise_root_cause]].
# r2e-gym cycles once its tasks are exhausted. Sandbox-env/mg-0 from overlay.

seq_len = 131072
max_steps = 300

[log]
level = "debug"

[model]
name = "Qwen/Qwen3.5-4B"

[monitors.wandb]
project = "prime_rl_ct"

[trainer.model]
attn = "auto"
ep = 1

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-6

[trainer.loss]
type = "cispo"
ratio_low = 0.0
ratio_high = 3.0

[orchestrator]
batch_size = 256
max_off_policy_steps = 1

[orchestrator.train]
group_size = 8

[orchestrator.concurrency]
initial_inflight = 256

[[orchestrator.train.source]]
name = "swe"
env.taskset.id = "r2e-gym"
env.agent.harness.id = "bash"
env.agent.runtime.labels = ["qwen3.5-4b-cortex-swe", "swe"]

[cortex.training]
model_provider = "default"

[cortex.sampling.vllm_config]
tensor_parallel_size = 1
language_model_only = true
