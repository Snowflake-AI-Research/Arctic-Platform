# Qwen3.5-4B math — FILTERED-i3_math variant. The clean-dataset run (math-clean.toml, Hendrycks) was
# too easy for this thinking model: step-1 all-reward 0.990, out-tok ~7k, no headroom to trend up, and
# admission starved on all-correct 0-variance groups. i3_math (INTELLECT-3-RL) has headroom but ~18%
# bad gold labels (see [[project_i3math_label_noise_root_cause]]).
#
# Fix: keep i3_math but use its native difficulty Filter on the Qwen3-4B-thinking offline solve-rate
# column, band [0.1, 0.9]. The bad labels cluster at solve==0 (the thinking ref never matches a wrong
# gold): filtering drops 80% of them (18% -> ~7% residual) AND the band guarantees headroom (the model
# gets 1/8..7/8 of these right -> mixed-variance groups -> real GRPO signal, healthy admission). 10,805
# problems pass the filter. No code change — Filter is i3_math's own config.
#
# Everything else matches math-stable.toml (131072 + dense LM-head chunking via jobs.py, CISPO cap 3.0,
# near-on-policy max_off_policy_steps=1). i3_math uses bare math-verify (no judge), fine for this data.

seq_len = 131072
max_steps = 30

[log]
level = "debug"

[model]
name = "Qwen/Qwen3.5-4B"

[monitors.wandb]
project = "prime_rl_ct"

[trainer.model]
attn = "auto"
ep = 1

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-6

[trainer.loss]
type = "cispo"
ratio_low = 0.0
ratio_high = 3.0

[orchestrator]
batch_size = 256
max_off_policy_steps = 1

[orchestrator.train]
group_size = 8

[orchestrator.concurrency]
initial_inflight = 512

[orchestrator.train.sampling]
max_completion_tokens = 131072

[[orchestrator.train.source]]
name = "math"
env.taskset.id = "i3_math"
env.taskset.filter.column = "avg@8_qwen3_4b_thinking_2507"
env.taskset.filter.min = 0.1
env.taskset.filter.max = 0.9
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[cortex.training]
model_provider = "default"

[cortex.sampling.vllm_config]
tensor_parallel_size = 1
language_model_only = true
