# Qwen3.5-4B math — STABILIZED variant (deviation from the public recipe, pre-staged for use IF the
# faithful recipe oscillates instead of climbing steadily). Adds the two Cortex-portable levers from
# the team's known-good 4B config (rl_mlts_qwen35_4b): CISPO importance-weight cap 3.0 (vs IPO's
# effectively-uncapped 1e4) and near-on-policy max_off_policy_steps=1 (vs 8). Everything else matches
# examples/qwen3.5-4b/math.toml (131072 + dense LM-head chunking via jobs.py).

seq_len = 131072
max_steps = 30

[log]
level = "debug"

[model]
name = "Qwen/Qwen3.5-4B"

[monitors.wandb]
project = "prime_rl_ct"

[trainer.model]
attn = "auto"
ep = 1

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-6

# Real IS-weight cap (known-good used is_weight_clip_max=3.0); damps stale off-policy gradient spikes.
[trainer.loss]
type = "cispo"
ratio_low = 0.0
ratio_high = 3.0

[orchestrator]
batch_size = 256
max_off_policy_steps = 1   # near-on-policy (known-good max_async_level=1), vs the faithful 8

[orchestrator.train]
group_size = 8

[orchestrator.concurrency]
initial_inflight = 512

[orchestrator.train.sampling]
max_completion_tokens = 131072

[[orchestrator.train.source]]
name = "math"
env.taskset.id = "i3_math"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[cortex.training]
model_provider = "default"

[cortex.sampling.vllm_config]
tensor_parallel_size = 1
language_model_only = true
