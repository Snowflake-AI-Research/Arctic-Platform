# SMOKE CONTROL (not a shipped recipe): the faithful qwen3-8b math recipe, no deviations, 35 steps.
# The no-knob reference for the Control-vs-CISPO comparison — identical to math.toml plus max_steps,
# run long enough to reach the baseline's sustained collapse zone (~step 24+).

seq_len = 32768
max_steps = 35

[log]
level = "debug"

[model]
name = "Qwen/Qwen3-8B"

[monitors.wandb]
project = "prime_rl_ct"

[trainer.model]
attn = "auto"
ep = 1

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-6

[orchestrator]
batch_size = 256
max_off_policy_steps = 8

[orchestrator.train]
group_size = 8

[orchestrator.concurrency]
initial_inflight = 512

[orchestrator.train.sampling]
max_completion_tokens = 32768

[[orchestrator.train.source]]
name = "math"
env.taskset.id = "i3_math"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[cortex.training]
model_provider = "default"

[cortex.sampling.vllm_config]
tensor_parallel_size = 1
