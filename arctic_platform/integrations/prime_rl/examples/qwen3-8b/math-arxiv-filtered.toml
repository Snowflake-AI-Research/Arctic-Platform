# Qwen3-8B (dense) math RL on Cortex, on a difficulty-FILTERED arxivmath: the hopeless tasks (never
# solved by the smaller model over many samples) are dropped, so most rollouts are productive and the
# GRPO groups carry signal instead of being all-zero. Pairs the denser signal with a bigger model's
# headroom, at a small batch for a fast, cheap cadence. One 8-GPU training sub-job + one 8-GPU
# sampling sub-job (TP 1). Qwen3-8B caps at max_position_embeddings=40960, so seq_len stays <= that.
#
#   python -m arctic_platform.integrations.prime_rl.rl \
#     @ arctic_platform/integrations/prime_rl/examples/qwen3-8b/math-arxiv-filtered.toml --env-package math-env

seq_len = 40960

[log]
level = "debug"

[model]
name = "Qwen/Qwen3-8B"

[monitors.wandb]
project = "prime_rl_ct"

[trainer.model]
attn = "auto"
ep = 1

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-6

[trainer.loss]
type = "cispo"
ratio_low = 0.0
ratio_high = 3.0

[orchestrator]
batch_size = 64   # 64 question-groups x group_size 8 = 512 rollouts/step
max_off_policy_steps = 1

[orchestrator.train]
group_size = 8

[orchestrator.concurrency]
initial_inflight = 512

[orchestrator.train.sampling]
max_completion_tokens = 32768

[[orchestrator.train.source]]
name = "math"
env.taskset.id = "math_env"
env.taskset.dataset_name = "/modeling-code/boyiliu/arxivmath_filtered"
env.taskset.dataset_subset = "default"
env.taskset.dataset_split = "train"
env.taskset.question_key = "question"
env.taskset.answer_key = "answer"
env.taskset.task.judge = "None"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
curriculum.sampler = { type = "difficulty_pool" }

[cortex.training]
model_provider = "default"

[cortex.sampling.vllm_config]
tensor_parallel_size = 1
