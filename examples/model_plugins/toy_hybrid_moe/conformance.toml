# Conformance fixture for ToyHybridMoE: a tiny fp32 model that still has every layer kind.
seed = 0
# Three packed rows of unequal length; 16 tokens split evenly across 2 sequence-parallel ranks, with the middle
# row crossing the shard boundary at token 8 so state from the previous rank is exercised.
sequence_lengths = [5, 6, 5]
sp_sizes = [2]
ep_sizes = [2]

[fixture]
vocab_size = 64
hidden_size = 32
layer_types = ["linear_attention", "full_attention", "conv", "full_attention"]
mlp_types = ["dense", "moe", "moe", "dense"]
num_attention_heads = 4
num_key_value_heads = 2
head_dim = 8
recurrence_heads = 4
recurrence_head_dim = 8
num_experts = 4
num_experts_per_tok = 2
attention_value_conv = true     # the value-convolution sub-layer
final_logit_softcapping = 2.0   # small enough to bend the fixture's logits: exercises compute_logits

# fp32 on CPU: the model and its float64 reference differ only by fp32 rounding (~1e-7 relative) over four layers;
# packed, parallel and padded runs reorder the same fp32 sums. 1e-5 absolute is well under any real bug's effect.
[tolerances]
reference = 1e-5
packing = 1e-5
parallel = 1e-5
rl_step = 1e-5
chunking = 1e-6   # chunking reorders the output projection's gradient sum: fp32 rounding, not bitwise
