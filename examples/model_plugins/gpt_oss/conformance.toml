# Conformance fixture for gpt-oss: a tiny fp32 GptOssConfig with both attention kinds, YaRN rotary and 4 experts.
seed = 0
# Three packed rows of unequal length; 16 tokens split evenly across 2 sequence-parallel ranks, with the middle
# row crossing the shard boundary at token 8. Rows are longer than the window, so the window is exercised.
sequence_lengths = [5, 6, 5]
sp_sizes = [2]
ep_sizes = [2]

[fixture]
vocab_size = 64
hidden_size = 32
intermediate_size = 16
num_hidden_layers = 2
layer_types = ["sliding_attention", "full_attention"]
sliding_window = 3
num_attention_heads = 4
num_key_value_heads = 2
head_dim = 8
num_local_experts = 4
num_experts_per_tok = 2
max_position_embeddings = 64
# YaRN, as gpt-oss uses, scaled from a 32-token original context
rope_parameters = { rope_type = "yarn", factor = 2.0, original_max_position_embeddings = 32, rope_theta = 150000.0, beta_fast = 32.0, beta_slow = 1.0, truncate = false }

# fp32 against a float64 reference: differences are fp32 rounding (~1e-7 relative).
[tolerances]
reference = 1e-5
packing = 1e-5
parallel = 1e-5
rl_step = 1e-5
chunking = 1e-6
